<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Register New Book - Book Platform</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #27ae60;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
    }

    .btn {
      display: inline-block;
      background: #27ae60;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #219150;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #7f8c8d;
      text-decoration: none;
    }

    .error {
      color: #e74c3c;
      font-size: 0.875rem;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 th:text="${book.id == null} ? '新しい本を登録' : '本の情報を編集'">新しい本を登録</h1>
    <form th:action="${book.id == null} ? @{/books/new} : @{/books/update/{id}(id=${book.id})}" th:object="${book}"
      method="post">
      <div class="form-group">
        <label for="title">タイトル</label>
        <input type="text" id="title" th:field="*{title}" placeholder="例: スプリングブート入門">
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title Error</div>
      </div>
      <div class="form-group">
        <label for="author">著者</label>
        <input type="text" id="author" th:field="*{authorName}" placeholder="例: 田中 太郎">
        <div class="error" th:if="${#fields.hasErrors('authorName')}" th:errors="*{authorName}">Author Error</div>
      </div>
      <div class="form-group">
        <label for="description">説明</label>
        <textarea id="description" th:field="*{summary}" placeholder="本の内容について簡単に記載してください"></textarea>
      </div>
      <button type="submit" class="btn" th:text="${book.id == null} ? '登録する' : '更新する'">登録する</button>
    </form>
    <a href="/books" class="back-link">← 一覧に戻る</a>
  </div>
</body>

</html>
